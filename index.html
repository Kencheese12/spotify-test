<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Monitor</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
    img { width: 250px; height: 250px; border-radius: 8px; margin-top: 15px; }
    .card { background: #181818; padding: 20px; border-radius: 12px; display: inline-block; }
    button { background: #1db954; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="card">
    <div id="login-btn">
      <button onclick="redirectToSpotify()">Spotifyと連携する</button>
    </div>

    <div id="player" style="display: none;">
      <img id="album-art" src="" alt="Album Art">
      <h2 id="track-name">-</h2>
      <p id="artist-name">-</p>
    </div>
  </div>

  <script>
    // ★ご自身の Client ID と Redirect URI を設定してください
    const CLIENT_ID = 'b36f6df6a5b14c1ba8eb7e5c08b3c82b';
    const REDIRECT_URI = 'https://kencheese12.github.io/spotify-test/⁠'; 
    const SCOPES = 'user-read-currently-playing user-read-playback-state';

    // 1. PKCEコードチャレンジの生成関数群
    function generateRandomString(length) {
      let text = '';
      let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      for (let i = 0; i < length; i++) {
        text += possible.charAt(Math.floor(Math.random() * possible.length));
      }
      return text;
    }

    async function generateCodeChallenge(codeVerifier) {
      const data = new TextEncoder().encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode.apply(null, new Uint8Array(digest)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    // 2. ログインボタンを押した時の処理（Spotifyへ飛ばす）
    async function redirectToSpotify() {
      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      localStorage.setItem("code_verifier", verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      document.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    // 3. Spotifyから戻ってきた時のトークン取得処理
    async function getAccessToken(code) {
      const verifier = localStorage.getItem("code_verifier");
      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      const response = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await response.json();
      return data.access_token;
    }

    // 4. 現在再生中の曲を取得して画面を更新する
    async function fetchCurrentlyPlaying(token) {
      const response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (response.status === 204 || response.status === 202) {
        document.getElementById('track-name').innerText = "何も再生されていません";
        document.getElementById('artist-name').innerText = "-";
        return;
      }

      const data = await response.json();
      if (data && data.item) {
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('player').style.display = 'block';
        document.getElementById('album-art').src = data.item.album.images[0].url;
        document.getElementById('track-name').innerText = data.item.name;
        document.getElementById('artist-name').innerText = data.item.artists.map(a => a.name).join(', ');
      }
    }

    // 5. ページ読み込み時の処理
    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');

      if (code) {
        // URLにcodeがあればトークンを取得して保存
        const token = await getAccessToken(code);
        localStorage.setItem("access_token", token);
        // URLをきれいにする
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const token = localStorage.getItem("access_token");
      if (token) {
        // トークンがあれば再生情報を取得し、5秒ごとに自動更新
        fetchCurrentlyPlaying(token);
        setInterval(() => fetchCurrentlyPlaying(token), 5000);
      }
    };
  </script>
</body>
</html>
